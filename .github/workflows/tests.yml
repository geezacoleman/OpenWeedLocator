name: Tests

# Every push on every branch, and every PR. Until v3.22 this ran only on
# main/display-bug: the v3.17 commit that stopped images saving on most units
# DID fail CI (display-bug, 2026-09-15), but the branch stayed red and the
# field branches never ran CI at all. A red run means no field deploy.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in a few minutes. A hang or a killed runner should fail
    # fast instead of burning the default 6-hour limit.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11: Bookworm units still in the field. 3.13: Trixie (the target).
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # From the requirements file, not a hand-written list (the list
        # drifted and silently dropped tests). opencv-python-headless replaces
        # opencv-python because the runner has no display. httpx is the one
        # controller dependency the agent tests need; requirements-controller.txt
        # pins flask 2.2 and cannot be installed alongside the OWL's flask 3.
        run: |
          pip install pytest pytest-xdist httpx
          pip install -r non_rpi_requirements.txt
          pip uninstall -y opencv-python
          pip install opencv-python-headless

      - name: Create runtime stubs
        run: |
          mkdir -p custom_algorithms
          touch custom_algorithms/__init__.py

      - name: Run tests
        # Only one file is skipped, for a stated reason. Do not add an
        # --ignore to make CI green: fix the test or the code.
        #   test_custom_algorithms.py: tests custom_algorithms/, which is
        #   gitignored (user code on the device), so it is not in the checkout.
        run: |
          pytest tests/ -n auto -q --durations=25 \
            --ignore=tests/agent/test_custom_algorithms.py
