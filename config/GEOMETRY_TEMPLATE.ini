# GEOMETRY_TEMPLATE.ini — reference for per-unit MOUNT geometry
#
# This is a DOCUMENTED TEMPLATE, not the live file. The real config/GEOMETRY.ini is
# device-resident (git-ignored) and is created ONLY when you first use the "Adjust
# geometry" editor in the dashboard (or copy this template by hand). While it is
# absent, owl.py falls back to the legacy crop_factor_*/actuation_zone values in the
# active config — so an update never overrides a unit's existing geometry.
#
# GEOMETRY.ini holds the crop rectangle and actuation band for THIS OWL. It is
# physical to how the unit is mounted, so it lives separately from the named
# detection configs: loading/switching a detection config (sensitivity, algorithm,
# thresholds) never changes geometry, and saving a detection config never captures it.
#
# owl.py reads config/GEOMETRY.ini LAST (after the active config and CONTROLLER.ini),
# so its keys win over any legacy crop_*/actuation_* values once it exists.
#
# Fractions, edited via the dashboard or by hand:
#   crop_*        0.0-0.49  inset from each edge
#   actuation_*   0.0-1.0   band (of cropped height) a weed must be in to fire

[Camera]
crop_left = 0.02
crop_right = 0.02
crop_top = 0.02
crop_bottom = 0.02

[System]
actuation_top = 0.0
actuation_bottom = 1.0
