# GEOMETRY.ini — per-unit MOUNT geometry (device-resident)
#
# This file holds the crop rectangle and actuation band for THIS OWL. It is
# physical to how the unit is mounted, so it lives separately from the named
# detection configs: loading/switching a detection config (sensitivity, algorithm,
# thresholds) never changes geometry, and saving a detection config never captures
# it. The "Adjust geometry" editor in the dashboard writes this file in place.
#
# owl.py reads this file LAST (after the active config and CONTROLLER.ini), so the
# keys below always win over any legacy crop_*/actuation_* values in older configs.
#
# Fractions, edited via the dashboard or by hand:
#   crop_*        0.0-0.49  inset from each edge
#   actuation_*   0.0-1.0   band (of cropped height) a weed must be in to fire

[Camera]
crop_left = 0.02
crop_right = 0.02
crop_top = 0.02
crop_bottom = 0.02

[System]
actuation_top = 0.0
actuation_bottom = 1.0
