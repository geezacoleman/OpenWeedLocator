[System]
algorithm = exhsv
input_file_or_directory =
relay_num = 4
actuation_duration = 0.15
delay = 0
# Actuation band — a weed fires its relay only while its centre is INSIDE this
# vertical band of the cropped frame. Fractions of cropped height: 0.0 = top of
# crop, 1.0 = bottom. Default (0.0–1.0) = whole frame active. Raise actuation_top
# to ignore weeds too far ahead; lower actuation_bottom to ignore weeds too close.
actuation_top = 0.0
actuation_bottom = 1.0
# Legacy single-value zone (bottom-anchored %). Used only if actuation_top/bottom
# are absent: actuation_top = 1 - actuation_zone/100, actuation_bottom = 1.0.
actuation_zone = 100

[Controller]
controller_type = none

# Shared LED pins (BOARD numbering, set to 'none' to disable)
status_led_pin = 40
gps_led_pin = 38

# Ute controller (single switch — controls recording OR detection)
switch_purpose = recording
switch_pin = 36

# Advanced controller (3-position detection mode + recording + sensitivity switches)
detection_mode_pin_up = 36
detection_mode_pin_down = 35
recording_pin = 33
sensitivity_pin = 32
# Previous defaults (pre-2026-04): recording_pin = 38, sensitivity_pin = 40
# Changed because 38/40 conflicted with gps_led_pin/status_led_pin

[Visualisation]
image_loop_time = 5

[Camera]
resolution_width = 1456
resolution_height = 1088
exp_compensation = -2
# Per-edge crop — fraction inset from each edge (0.0–0.49). Trims edge artifacts
# and lets you exclude e.g. a boom or wheel track on one side. Lanes are computed
# across the remaining (cropped) width and recenter automatically.
crop_left = 0.02
crop_right = 0.02
crop_top = 0.02
crop_bottom = 0.02
# Legacy symmetric crop. Used only if the per-edge keys above are absent:
# crop_factor_horizontal -> left + right, crop_factor_vertical -> top + bottom.
crop_factor_horizontal = 0.02
crop_factor_vertical = 0.02
camera_type = auto
# Allow resolutions above 832x640 on Pi 3/4. Default off - protects older Pis
# from camera/GPU memory issues that can cause instability. Enable only after
# confirming your hardware handles the target resolution.
allow_high_resolution = False

[GreenOnGreen]
model_path = models
confidence = 0.5
detect_classes = 
actuation_mode = centre
min_detection_pixels = 50
inference_resolution = 320
crop_buffer_px = 20

[GreenOnBrown]
exg_min = 25
exg_max = 200
hue_min = 39
hue_max = 83
saturation_min = 50
saturation_max = 220
brightness_min = 60
brightness_max = 190
min_detection_area = 10
invert_hue = False

[DataCollection]
image_sample_enable = False
detection_enable = True
sample_method = whole
sample_frequency = 30
save_directory = owl_data
log_fps = False
camera_name = cam1

[Relays]
0 = 13
1 = 15
2 = 16
3 = 18

[Tracking]
tracking_enabled = False
track_high_thresh = 0.2
track_low_thresh = 0.05
new_track_thresh = 0.2
track_buffer = 60
match_thresh = 0.8
track_class_window = 5
track_crop_persist = 3
detection_persist_frames = 10

[Sensitivity]
active = medium

[Sensitivity_Low]
exg_min = 25
exg_max = 200
hue_min = 41
hue_max = 80
saturation_min = 52
saturation_max = 218
brightness_min = 62
brightness_max = 188
min_detection_area = 20

[Sensitivity_Medium]
exg_min = 25
exg_max = 200
hue_min = 39
hue_max = 83
saturation_min = 50
saturation_max = 220
brightness_min = 60
brightness_max = 190
min_detection_area = 10

[Sensitivity_High]
exg_min = 22
exg_max = 210
hue_min = 35
hue_max = 85
saturation_min = 40
saturation_max = 225
brightness_min = 50
brightness_max = 200
min_detection_area = 5


