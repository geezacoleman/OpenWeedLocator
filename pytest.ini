[pytest]
testpaths = tests
# Benchmarks are excluded from the default run. They took ~30s of unthrottled
# timing on every `pytest tests/`, wrote result files into benchmarks/ as a side
# effect, and their regression check compares a commit against measurements
# taken minutes earlier on the same machine — so it reported swings of several
# hundred percent for identical code. Run them deliberately:
#   pytest -m benchmark
addopts = -m "not benchmark"
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may need MQTT broker)
    benchmark: Timing benchmarks — not run by default, results are machine-specific
